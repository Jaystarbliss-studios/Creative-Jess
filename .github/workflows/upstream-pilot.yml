name: Upstream MCP pilot smoke tests

on:
  push:
    branches:
      - work/real-integration-foundation
    paths:
      - '.github/workflows/upstream-pilot.yml'
      - 'scripts/smoke-mcp.mjs'
      - 'scripts/bootstrap-upstream.ps1'
      - 'companion/mcpBroker.ts'
  workflow_dispatch:
    inputs:
      include_scoped_filesystem_roots:
        description: Also verify the documented scoped read/write-root flags
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build and smoke-test ${{ matrix.repository }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: photocraft
            cli_package: photocraft-cli
            desktop_package: photocraft
            supports_roots: true
          - repository: vectorcraft
            cli_package: vectorcraft-cli
            desktop_package: vectorcraft
            supports_roots: true
          - repository: designcraft
            cli_package: designcraft-cli
            desktop_package: designcraft
            supports_roots: false
          - repository: pdfcraft
            cli_package: pdfcraft-cli
            desktop_package: pdfcraft
            supports_roots: false
          - repository: wordcraft
            cli_package: wordcraft-cli
            desktop_package: wordcraft
            supports_roots: false
          - repository: deckcraft
            cli_package: deckcraft-cli
            desktop_package: deckcraft
            supports_roots: false
          - repository: gridcraft
            cli_package: gridcraft-cli
            desktop_package: gridcraft
            supports_roots: false
          - repository: soundcraft
            cli_package: soundcraft-cli
            desktop_package: soundcraft
            supports_roots: false
          - repository: cadcraft
            cli_package: cadcraft-cli
            desktop_package: cadcraft
            supports_roots: false
          - repository: effectcraft
            cli_package: effectcraft-cli
            desktop_package: effectcraft
            supports_roots: false
          - repository: filmcraft
            cli_package: filmcraft-cli
            desktop_package: filmcraft
            supports_roots: false
          - repository: lightcraft
            cli_package: lightcraft-cli
            desktop_package: lightcraft
            supports_roots: false
    steps:
      - name: Checkout integration workspace
        uses: actions/checkout@v4
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: storytold/${{ matrix.repository }}
          ref: main
          path: .upstream/${{ matrix.repository }}
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .upstream/${{ matrix.repository }}
      - name: Record toolchain and workspace metadata
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cargo metadata --manifest-path ".upstream/${{ matrix.repository }}/Cargo.toml" --no-deps --format-version 1 | Out-File -Encoding utf8 ".upstream/${{ matrix.repository }}/cargo-metadata.json"
      - name: Build desktop app and CLI
        shell: pwsh
        run: |
          $logFile = ".upstream/${{ matrix.repository }}/verification.log"
          "=== rustc ===" | Tee-Object -FilePath $logFile
          rustc --version 2>&1 | Tee-Object -FilePath $logFile -Append
          cargo --version 2>&1 | Tee-Object -FilePath $logFile -Append
          "=== cargo build desktop + CLI ===" | Tee-Object -FilePath $logFile -Append
          cargo build --manifest-path ".upstream/${{ matrix.repository }}/Cargo.toml" --release -p "${{ matrix.desktop_package }}" -p "${{ matrix.cli_package }}" 2>&1 | Tee-Object -FilePath $logFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test actual MCP server
        shell: pwsh
        env:
          INCLUDE_ROOT_FLAGS: ${{ (github.event_name == 'push' || inputs.include_scoped_filesystem_roots) && matrix.supports_roots }}
        run: |
          $logFile = ".upstream/${{ matrix.repository }}/verification.log"
          $binary = (Resolve-Path ".upstream/${{ matrix.repository }}/target/release/${{ matrix.cli_package }}.exe").Path
          $smokeArgs = @('--binary', $binary)
          if ($env:INCLUDE_ROOT_FLAGS -eq 'true') { $smokeArgs += '--scoped-roots' }
          if ('${{ matrix.repository }}' -eq 'wordcraft') { $smokeArgs += @('--acceptance', 'wordcraft') }
          if ('${{ matrix.repository }}' -eq 'gridcraft') { $smokeArgs += @('--acceptance', 'gridcraft') }
          if ('${{ matrix.repository }}' -eq 'deckcraft') { $smokeArgs += @('--acceptance', 'deckcraft') }
          node scripts/smoke-mcp.mjs @smokeArgs 2>&1 | Tee-Object -FilePath $logFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build metadata and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-${{ matrix.repository }}-verification
          path: |
            .upstream/${{ matrix.repository }}/cargo-metadata.json
            .upstream/${{ matrix.repository }}/verification.log
          if-no-files-found: warn
