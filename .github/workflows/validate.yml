name: Validate workspace

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/smoke-mcp.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
